<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Percent — exam prep">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="percent">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Percent</title>
  <link rel="manifest" href="manifest.json">

  <!--
    NOTE: Do NOT add intent:// redirects or "open in Chrome" interstitials here.
    The app runs inside Instagram's in-app browser on purpose (phone-OTP auth
    works there). CanvasKit assets are pinned to this origin in
    web/flutter_bootstrap.js so the WebView never fetches from the gstatic CDN.
  -->

  <!-- Cashfree checkout SDK (used by the membership payment flow). -->
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
  <script>
    function initiateCashfreePayment(paymentSessionId, mode) {
      const cashfree = Cashfree({ mode: mode });
      cashfree.checkout({
        paymentSessionId: paymentSessionId,
        redirectTarget: "_modal",
      }).then(function(result) {
        if (result.error) {
          if (window._cashfreeCallback) window._cashfreeCallback('error', result.error.message);
        } else if (result.paymentDetails) {
          if (window._cashfreeCallback) window._cashfreeCallback('success', result.paymentDetails.paymentMessage);
        }
      });
    }
  </script>
  <style>
    #boot {
      position: fixed; inset: 0; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff; color: #0F172A; text-align: center; padding: 24px;
    }
    #boot .logo {
      width: 76px; height: 76px; margin-bottom: 22px; border-radius: 22px;
      background: linear-gradient(135deg, #4F46E5, #6366F1);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 40px; font-weight: 900; line-height: 1;
      box-shadow: 0 10px 30px rgba(79,70,229,0.28);
    }
    #boot .spin {
      width: 26px; height: 26px;
      border: 3px solid #E5E7F5; border-top-color: #4F46E5;
      border-radius: 50%; animation: bspin 0.8s linear infinite;
    }
    #boot #boot-msg {
      margin-top: 16px; font-size: 13px; font-weight: 500; color: #94A3B8;
    }
    @keyframes bspin { to { transform: rotate(360deg); } }

    /* Firebase web phone-auth uses an INVISIBLE reCAPTCHA. Its container
       (#__ff-recaptcha-container) must stay in the DOM and renderable for the
       reCAPTCHA to initialise — so we must NOT display:none it. Instead we make
       it take up no visible space (0x0, off-screen) so it never shows over the
       app, while still being present for Firebase. We also hide the persistent
       "protected by reCAPTCHA" badge. The actual challenge popup, when Google
       genuinely requires one, is a separate fixed-position iframe that is not
       affected by these rules and remains fully interactive. */
    .grecaptcha-badge { visibility: hidden !important; }
    #__ff-recaptcha-container {
      position: absolute !important;
      width: 0 !important; height: 0 !important;
      overflow: hidden !important;
      left: -9999px !important; top: -9999px !important;
    }
    #boot pre {
      display: none; white-space: pre-wrap; word-break: break-word;
      font-size: 12px; text-align: left; color: #b91c1c;
      background: #FEF2F2; border: 1px solid #FECACA;
      padding: 12px; border-radius: 8px; max-width: 92vw; max-height: 50vh;
      overflow: auto; margin-top: 16px;
    }
  </style>
</head>
<body>
  <!-- Clean branded boot screen + invisible on-screen error catcher. Flutter
       paints over this once it renders; if it never does, any JS error shows
       here instead of a silent white screen. -->
  <div id="boot">
    <div class="logo">%</div>
    <div class="spin"></div>
    <div id="boot-msg">Loading…</div>
    <pre id="boot-err"></pre>
  </div>
  <script>
    (function () {
      var errBox = document.getElementById('boot-err');
      var msg = document.getElementById('boot-msg');
      function show(text) {
        if (!errBox) return;
        msg.textContent = 'Something went wrong loading the app:';
        errBox.style.display = 'block';
        errBox.textContent += text + '\n';
      }
      window.addEventListener('error', function (e) {
        show((e.message || 'Script error') +
             (e.filename ? '  @ ' + e.filename + ':' + e.lineno : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        show('Promise rejected: ' + (e.reason && (e.reason.message || e.reason)));
      });
      // If nothing has rendered after 12s, surface a hint.
      setTimeout(function () {
        if (document.getElementById('boot') &&
            errBox && errBox.style.display !== 'block') {
          msg.textContent = 'Still loading… (renderer may be blocked here)';
        }
      }, 12000);
    })();
    // Remove the boot screen once Flutter's first frame is up.
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (b) b.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
