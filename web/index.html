  <script>
    // Redirect Android visitors to the Play Store.
    // Runs before Flutter loads so we never download the app engine unnecessarily.
    // Escape hatches: ?stay=1 (or #stay) keeps the web app; a sessionStorage guard
    // prevents a redirect loop when the user taps "back" from the Play Store.
    (function() {
      var PLAY_URL = 'https://play.google.com/store/apps/details?id=com.moralmosaic.percent';
      var PACKAGE = 'com.moralmosaic.percent';

      var ua = navigator.userAgent || '';
      var isAndroid = /Android/i.test(ua);
      if (!isAndroid) return;

      // Allow users to opt out of the redirect and use the web app.
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      if (/[?&]stay=1/.test(search) || /stay/i.test(hash)) return;

      // Don't bounce the user again if they came back from the Play Store.
      try {
        if (sessionStorage.getItem('pb_redirected') === '1') return;
        sessionStorage.setItem('pb_redirected', '1');
      } catch (e) { /* private mode: ignore */ }

      var isInAppBrowser = /Instagram|FBAN|FBAV|FB_IAB|LinkedInApp|Twitter|Snapchat/i.test(ua);
      if (isInAppBrowser) {
        // Inside Instagram/FB WebView, an https link opens a nested WebView instead
        // of the Play Store app. The intent:// scheme launches the Play Store app,
        // falling back to the https URL if the app is unavailable.
        window.location.href =
          'intent://details?id=' + PACKAGE +
          '#Intent;scheme=market;package=com.android.vending;' +
          'S.browser_fallback_url=' + encodeURIComponent(PLAY_URL) + ';end';
      } else {
        window.location.replace(PLAY_URL);
      }
    })();
  </script>

  <script>
    // Detect Instagram / Facebook in-app browser and show an interstitial
    // before Flutter loads, since Google sign-in popups are blocked there.
    (function() {
      var ua = navigator.userAgent || '';
      var isInAppBrowser = /Instagram|FBAN|FBAV|FB_IAB|LinkedInApp|Twitter|Snapchat/i.test(ua);
      if (isInAppBrowser) {
        document.addEventListener('DOMContentLoaded', function() {
          var overlay = document.createElement('div');
          overlay.id = 'iab-overlay';
          overlay.style.cssText = [
            'position:fixed;inset:0;z-index:99999',
            'background:#fff',
            'display:flex;flex-direction:column',
            'align-items:center;justify-content:center',
            'font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif',
            'padding:32px',
            'text-align:center',
          ].join(';');
          overlay.innerHTML = [
            '<div style="font-size:48px;margin-bottom:16px">📱</div>',
            '<h2 style="font-size:22px;font-weight:800;color:#1e293b;margin:0 0 10px">',
            'Open in Chrome for Google Sign-In</h2>',
            '<p style="color:#64748b;font-size:15px;line-height:1.6;margin:0 0 28px">',
            'Google sign-in doesn\'t work inside the Instagram browser.<br>',
            'Please open this page in Chrome or Safari.</p>',
            '<button id="iab-open-btn" style="',
            'background:#4F46E5;color:#fff;border:none;border-radius:14px;',
            'padding:16px 32px;font-size:16px;font-weight:700;cursor:pointer;',
            'width:100%;max-width:320px">',
            'Open in Browser</button>',
            '<p style="color:#94a3b8;font-size:12px;margin-top:16px">',
            'Tap the ··· menu → Open in browser</p>',
          ].join('');
          document.body.appendChild(overlay);
          document.getElementById('iab-open-btn').addEventListener('click', function() {
            // intent:// scheme opens Chrome on Android from in-app browsers
            var url = window.location.href;
            window.location.href = 'intent://' + url.replace(/^https?:\/\//, '') +
              '#Intent;scheme=https;package=com.android.chrome;end';
          });
        });
      }
    })();
  </script>
  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
  <script>
    function initiateCashfreePayment(paymentSessionId, mode) {
      const cashfree = Cashfree({ mode: mode });
      cashfree.checkout({
        paymentSessionId: paymentSessionId,
        redirectTarget: "_modal",
      }).then(function(result) {
        if (result.error) {
          if (window._cashfreeCallback) window._cashfreeCallback('error', result.error.message);
        } else if (result.paymentDetails) {
          if (window._cashfreeCallback) window._cashfreeCallback('success', result.paymentDetails.paymentMessage);
        }
      });
    }
  </script>

  <style>
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .loader {
      border: 16px solid #f3f3f3;
      border-radius: 50%;
      border-top: 16px solid blue;
      border-right: 16px solid green;
      border-bottom: 16px solid red;
      border-left: 16px solid pink;
      width: 120px;
      height: 120px;
      -webkit-animation: spin 2s linear infinite;
      animation: spin 2s linear infinite;
    }

    @-webkit-keyframes spin {
      0% {
        -webkit-transform: rotate(0deg);
      }
      100% {
        -webkit-transform: rotate(360deg);
      }
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
